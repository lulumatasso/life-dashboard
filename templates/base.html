<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Life Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="{{ url_for('home') }}">Life Dashboard</a>
            <nav>
                <a class="nav-link {% if request.path == url_for('home') %}active{% endif %}" href="{{ url_for('home') }}">
                    <span class="nav-icon-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 11.5 12 4l8 7.5"/>
                            <path d="M6 10v9a1 1 0 0 0 1 1h3v-5.5h4V20h3a1 1 0 0 0 1-1v-9"/>
                        </svg>
                    </span>
                    <span class="nav-label">Home</span>
                </a>
                <a class="nav-link {% if request.path.startswith('/classes') %}active{% endif %}" href="{{ url_for('classes') }}">
                    <span class="nav-icon-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 6.5c-1.6-1.1-4-1.6-6.5-1.2v13c2.5-.4 4.9.1 6.5 1.2 1.6-1.1 4-1.6 6.5-1.2v-13c-2.5-.4-4.9.1-6.5 1.2Z"/>
                            <path d="M12 6.5v13"/>
                        </svg>
                    </span>
                    <span class="nav-label">Classes</span>
                </a>
                <a class="nav-link {% if request.path == url_for('calendar_view') %}active{% endif %}" href="{{ url_for('calendar_view') }}">
                    <span class="nav-icon-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="5.5" width="16" height="14.5" rx="2"/>
                            <path d="M4 9.5h16"/>
                            <path d="M8.5 3v4M15.5 3v4"/>
                        </svg>
                    </span>
                    <span class="nav-label">Calendar</span>
                </a>
                <a class="nav-link {% if request.path.startswith('/applications') %}active{% endif %}" href="{{ url_for('applications') }}">
                    <span class="nav-icon-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3.5" y="7.5" width="17" height="11.5" rx="2"/>
                            <path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/>
                            <path d="M3.5 12.5h17"/>
                        </svg>
                    </span>
                    <span class="nav-label">Applications</span>
                </a>
                <a class="nav-link {% if request.path.startswith('/budget') %}active{% endif %}" href="{{ url_for('budget') }}">
                    <span class="nav-icon-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="8"/>
                            <path d="M12 7.5v9M9.5 9.3c0-1 1-1.6 2.5-1.6s2.5.6 2.5 1.6c0 2.2-5 1.5-5 3.7 0 1 1 1.6 2.5 1.6s2.5-.6 2.5-1.6"/>
                        </svg>
                    </span>
                    <span class="nav-label">Budget</span>
                </a>
            </nav>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
