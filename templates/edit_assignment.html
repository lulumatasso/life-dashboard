{% extends "base.html" %}
{% block title %}Edit {{ assignment.name }} — Life Dashboard{% endblock %}
{% block content %}
    <a class="back-link" href="{{ url_for('course_detail', course_id=course.id) }}">&larr; {{ course.name }}</a>
    <h1>Edit Assignment</h1>
    <p class="subtitle">for {{ course.name }}</p>
    <div class="card">
        <form class="stack" method="POST">
            <label>Assignment name
                <input type="text" name="name" value="{{ assignment.name }}" required>
            </label>
            <label>Due date
                <input type="date" name="due_date" value="{{ assignment.due_date.isoformat() if assignment.due_date else '' }}">
            </label>
            <label>Category (optional)
                <select name="category_id" onchange="document.getElementById('weight-field').disabled = !!this.value">
                    <option value="">No category — enter weight manually</option>
                    {% for cat in course.categories %}
                    <option value="{{ cat.id }}" {% if assignment.category_id == cat.id %}selected{% endif %}>{{ cat.name }} ({{ cat.value }}{{ " pts" if course.grading_mode == "points" else "%" }} total, {{ cat.assignments|length }} item{{ "s" if cat.assignments|length != 1 else "" }} so far)</option>
                    {% endfor %}
                </select>
            </label>
            <label>{% if course.grading_mode == "points" %}Points possible{% else %}Weight (% of final grade){% endif %} <span class="field-hint">(ignored if a category is selected)</span>
                <input type="number" id="weight-field" name="weight" min="0" {% if course.grading_mode != "points" %}max="100"{% endif %} step="0.1" value="{{ assignment.weight if assignment.weight is not none else '' }}" {% if assignment.category_id %}disabled{% endif %}>
            </label>
            <label>Status
                <select name="status">
                    {% for choice in status_choices %}
                    <option value="{{ choice }}" {% if assignment.status == choice %}selected{% endif %}>{{ choice }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>{% if course.grading_mode == "points" %}Points earned (if graded){% else %}Grade received (%, if graded){% endif %}
                <input type="number" name="grade" min="0" {% if course.grading_mode != "points" %}max="100"{% endif %} step="0.1" value="{{ assignment.grade if assignment.grade is not none else '' }}">
            </label>
            <div class="button-group">
                <button class="btn" type="submit">Save Changes</button>
            </div>
        </form>
        <form method="POST" action="{{ url_for('delete_assignment', course_id=course.id, assignment_id=assignment.id) }}" class="delete-form">
            <button type="submit" class="btn btn-danger">Delete Assignment</button>
        </form>
    </div>
{% endblock %}
