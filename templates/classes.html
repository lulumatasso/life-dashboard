<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Classes</title>
</head>
<body>
    <h1>My Classes</h1>
    <ul>
        {% for course in courses %}
        <li>
            <strong>{{ course.name }}</strong>
            &mdash; {{ course.professor }}, {{ course.credit_hours }} credits ({{ course.term }})
        </li>
        {% endfor %}
    </ul>
</body>
</html>
