{% extends "base.html" %}
{% block title %}Add Syllabus Link — Life Dashboard{% endblock %}
{% block content %}
    <a class="back-link" href="{{ url_for('course_detail', course_id=course.id) }}">&larr; {{ course.name }}</a>
    <h1>Add Syllabus Link</h1>
    <p class="subtitle">Point to a syllabus hosted elsewhere (Canvas, Google Drive, etc.) instead of uploading a file.</p>
    <div class="card">
        <form class="stack" method="POST">
            <label>Syllabus URL
                <input type="url" name="url" placeholder="https://..." value="{{ course.syllabus_url or '' }}" required>
            </label>
            <button class="btn" type="submit">Save Link</button>
        </form>
    </div>
{% endblock %}
