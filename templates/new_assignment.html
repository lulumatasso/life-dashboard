{% extends "base.html" %}
{% block title %}Add Assignment — Life Dashboard{% endblock %}
{% block content %}
    <a class="back-link" href="{{ url_for('course_detail', course_id=course.id) }}">&larr; {{ course.name }}</a>
    <h1>Add an Assignment</h1>
    <p class="subtitle">for {{ course.name }}</p>
    <div class="card">
        <form class="stack" method="POST">
            <label>Assignment name
                <input type="text" name="name" required>
            </label>
            <label>Due date
                <input type="date" name="due_date">
            </label>
            <label>Weight (% of final grade)
                <input type="number" name="weight" min="0" max="100" step="0.1">
            </label>
            <label>Status
                <select name="status">
                    {% for choice in status_choices %}
                    <option value="{{ choice }}">{{ choice }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Grade received (%, if graded)
                <input type="number" name="grade" min="0" max="100" step="0.1">
            </label>
            <button class="btn" type="submit">Add Assignment</button>
        </form>
    </div>
{% endblock %}
